<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オセロ 弐 — パターン評価AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1><a href="index.html" title="最初の画面に戻る（再読み込み）">オセロ <span class="ni">弐</span></a></h1>
      <p class="tagline">パターン評価 × 終盤完全読み × 定石</p>
      <nav class="nav"><a href="lessons.html">オセロ講座・練習問題</a><a href="about.html">AIのしくみ</a></nav>
    </header>

    <section class="table">
      <div class="scoreline">
        <div class="side side-black" id="sideBlack">
          <span class="chip black"></span>
          <span class="who" id="whoBlack">黒</span>
          <span class="count" id="countBlack">2</span>
        </div>
        <div class="turn" id="turn" aria-live="polite">設定を選んで「対局開始」</div>
        <div class="side side-white" id="sideWhite">
          <span class="count" id="countWhite">2</span>
          <span class="who" id="whoWhite">白</span>
          <span class="chip white"></span>
        </div>
      </div>

      <div class="board-frame">
        <div class="files" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
        <div class="ranks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
        <div class="board" id="board" role="grid" aria-label="オセロ盤"></div>
        <div class="toast" id="toast" hidden></div>
        <div class="result" id="result" hidden>
          <p class="result-title" id="resultTitle"></p>
          <p class="result-score" id="resultScore"></p>
          <button type="button" class="btn primary" id="again">もう一局</button>
        </div>
      </div>

      <div class="meter" id="meter" title="AIの読みによる形勢（黒から見た石差）">
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
        <div class="meter-text" id="meterText">形勢 —</div>
      </div>
      <p class="ai-line" id="aiLine">&nbsp;</p>
    </section>

    <aside class="panel">
      <div class="group" id="settings">
        <h2>対局設定</h2>
        <div class="row">
          <span class="label">あなたの色</span>
          <div class="seg" role="radiogroup" aria-label="あなたの色">
            <label><input type="radio" name="color" value="black" checked><span>黒（先手）</span></label>
            <label><input type="radio" name="color" value="white"><span>白（後手）</span></label>
          </div>
        </div>
        <div class="row">
          <span class="label" id="levelLabel">AIの強さ <output id="levelOut">5</output></span>
          <div class="levels" id="levels" role="radiogroup" aria-labelledby="levelLabel"></div>
          <div class="level-scale" aria-hidden="true"><span>弱い</span><span>強い</span></div>
          <p class="level-desc" id="levelDesc"></p>
        </div>
        <div class="row checks">
          <label><input type="checkbox" id="showMoves" checked> 置ける場所を表示</label>
          <label><input type="checkbox" id="showEval" checked> 形勢を表示</label>
          <label><input type="checkbox" id="showCoach" checked> 解説（AIの手の特徴・自分の手の講評）</label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="start">対局開始</button>
        <button type="button" class="btn" id="undo" disabled>待った</button>
        <button type="button" class="btn" id="hint" disabled>ヒント</button>
      </div>

      <div class="group record">
        <h2>棋譜 <span class="opening" id="opening"></span></h2>
        <p class="kifu" id="kifu">—</p>
        <div class="replay" role="group" aria-label="棋譜の再生">
          <button type="button" class="btn sm" id="rvFirst" title="最初へ">⏮</button>
          <button type="button" class="btn sm" id="rvPrev" title="1手戻る（←）">◀</button>
          <span class="rv-pos" id="rvPos">0 / 0</span>
          <button type="button" class="btn sm" id="rvNext" title="1手進む（→）">▶</button>
          <button type="button" class="btn sm" id="rvLast" title="最新へ">⏭</button>
          <button type="button" class="btn sm" id="rvPlay" title="自動再生">再生</button>
        </div>
        <div class="replay">
          <button type="button" class="btn sm" id="kifuCopy">棋譜をコピー</button>
          <button type="button" class="btn sm" id="kifuLoad">棋譜を読み込む</button>
        </div>
      </div>

      <div class="group coach" id="coachBox">
        <h2>解説 <a class="opening" href="lessons.html">講座を読む</a></h2>
        <div id="coachYou" class="coach-block"></div>
        <div id="coachAI" class="coach-block"><p class="coach-empty">対局を始めると、AIの手の特徴と、あなたの手の講評がここに出ます。</p></div>
      </div>

      <details class="group evalbox" id="evalBox">
        <summary>評価の内訳（AIの目）</summary>
        <div id="evalBody"><p class="coach-empty">評価関数を読み込み中…</p></div>
      </details>
    </aside>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/weights.js"></script>
  <script src="js/book.js"></script>
  <script src="js/openings.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/ai-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
